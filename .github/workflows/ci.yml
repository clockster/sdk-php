name: CI

on:
  # Every branch, so work is checked before a pull request exists. Not tags: a release tag is the
  # release workflow's, and it runs these same checks itself.
  push:
    branches: ['**']
  pull_request:

# Nothing here reads or writes the repository beyond checking it out.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A pull request from this repository duplicates the push that its own branch already made;
    # one from a fork has no such push, and is the only case the pull_request event has to cover.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor composer.json declares, and the versions after it.
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: composer lint

      - run: composer analyse

      - run: composer test

      # Every operation in the specification must be reachable; a name collision merges two silently.
      - run: composer operations

  generated:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, json
          coverage: none

      - uses: ramsey/composer-install@v3

      # The committed client must be what the committed specification produces.
      - run: composer generate

      - run: git diff --exit-code -- src/Generated || (echo '::error::src/Generated is stale. Run `composer generate`.' && exit 1)
